version: 2

updates:
  # Renderer dependencies (bun.lock)
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Africa/Nairobi"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      renderer:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      renderer-security:
        applies-to: security-updates
        patterns: ["*"]
    cooldown:
      default-days: 5

  # Rust backend (src-tauri/Cargo.lock)
  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Africa/Nairobi"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      rust:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      rust-security:
        applies-to: security-updates
        patterns: ["*"]
    cooldown:
      default-days: 5

  # Workflow actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Africa/Nairobi"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      actions:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
